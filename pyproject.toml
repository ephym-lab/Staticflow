[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "staticfloww"
version = "0.1.2"
authors = [
  { name="Ephy Mucira", email="ephymmucira@gmail.com" },
]
description = "Universal Gateway Framework for God Schema Architectures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "motor>=3.1.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "flask>=3.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
